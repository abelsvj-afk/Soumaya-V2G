<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Soumaya · Second Brain</title>
    <meta name="description" content="Your thoughts become a living galaxy you can talk to." />
    <!-- PWA: installable to the home screen on Android + iOS -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#080514" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Soumaya" />
    <style>
      #boot-fallback {
        position: fixed; inset: 0; z-index: 9998; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px; background: #080514;
        color: #8ea0c4; font-family: system-ui, sans-serif;
      }
      #boot-fallback .orb {
        width: 54px; height: 54px; border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffd98a, #ff9d3c 55%, #6a3bff);
        box-shadow: 0 0 40px #ff9d3c88; animation: bootpulse 1.8s ease-in-out infinite;
      }
      @keyframes bootpulse { 0%,100% { transform: scale(.9); opacity: .8 } 50% { transform: scale(1.05); opacity: 1 } }
      #boot-fallback p { font-size: 13px; letter-spacing: .06em; margin: 0 }
    </style>
  </head>
  <body>
    <!-- Immediate, dependency-free loader so the first paint is never blank. React
         removes this the moment it boots (window.__brainBooted). -->
    <div id="boot-fallback"><div class="orb"></div><p>Aligning the stars…</p></div>
    <div id="root"></div>
    <script>
      /*
       * BOOT FAILSAFE — vanilla, inline, no dependencies. index.html is served
       * network-first (never trapped by the service worker), so THIS always reaches
       * the device even if the JS bundle is stale or broken. If the app doesn't
       * signal a good boot in time, we show a recovery panel whose "Reset app"
       * button clears the service worker + all caches — the escape hatch out of an
       * infinite loading screen (which is almost always a stale cached bundle).
       */
      (function () {
        var booted = false;
        window.__brainBooted = function () {
          booted = true;
          var f = document.getElementById("boot-fallback");
          if (f) f.remove();
          var r = document.getElementById("boot-recovery");
          if (r) r.remove();
        };
        function showRecovery(reason) {
          if (booted || document.getElementById("boot-recovery")) return;
          var o = document.createElement("div");
          o.id = "boot-recovery";
          o.style.cssText =
            "position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#080514;color:#eaf0ff;font-family:system-ui,sans-serif;padding:24px;text-align:center";
          o.innerHTML =
            '<div style="max-width:360px"><div style="font-size:40px;margin-bottom:8px">🛰️</div>' +
            '<h2 style="margin:0 0 8px;font-size:18px">This is taking too long to load</h2>' +
            '<p style="margin:0 0 18px;opacity:.8;font-size:14px;line-height:1.5">It\'s almost always an old cached version stuck on your device. Resetting clears it — your brain is safe on the server.</p>' +
            '<button id="br-reset" style="display:block;width:100%;margin:0 0 8px;padding:13px;border-radius:11px;border:1px solid #9686ff;background:#9686ff40;color:#fff;font-size:15px;font-weight:600;cursor:pointer">↻ Reset app (clear cache)</button>' +
            '<button id="br-reload" style="display:block;width:100%;padding:13px;border-radius:11px;border:1px solid #ffffff2a;background:#ffffff10;color:#eaf4ff;font-size:15px;cursor:pointer">Just reload</button>' +
            '<p style="margin:14px 0 0;opacity:.45;font-size:11px">' + (reason || "") + "</p></div>";
          document.body.appendChild(o);
          document.getElementById("br-reload").onclick = function () { location.reload(); };
          document.getElementById("br-reset").onclick = function () {
            var done = function () { location.replace(location.pathname + "?fresh=" + Date.now()); };
            var jobs = [];
            try {
              if (window.caches && caches.keys)
                jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
              if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
                jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
            } catch (e) { /* fall through to reload */ }
            Promise.all(jobs).then(done, done);
            setTimeout(done, 2500); // never hang on the reset itself
          };
        }
        // Boot watchdog: if the app hasn't signalled a good boot, offer recovery.
        setTimeout(function () { showRecovery("boot watchdog · timed out"); }, 11000);
        // A hard bundle error before boot → offer recovery quickly.
        window.addEventListener("error", function (e) {
          if (!booted && e && e.message && /import|module|chunk|unexpected|SyntaxError/i.test(e.message))
            setTimeout(function () { showRecovery("load error"); }, 400);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
