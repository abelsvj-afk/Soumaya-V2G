# fly.toml app configuration file generated for soumaya-v2g on 2026-09-11T19:07:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'soumaya-v2g'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  AUTONOMY = 'on'
  DB_PATH = '/data/brain.db'
  EMBED_CACHE_DIR = '/app/.model-cache'
  PORT = '8080'
  WEB_DIR = '/app/packages/web/dist'

[[mounts]]
  source = 'brain_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '1m30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
