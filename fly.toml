# fly.toml app configuration file generated for brain-soumaya-v1 on 2026-06-15T22:23:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'brain-soumaya-v1'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/brain.db'
  EMBED_CACHE_DIR = '/app/.model-cache'
  PORT = '8080'
  WEB_DIR = '/app/packages/web/dist'
  # 24/7 autonomy: Soumaya evolves every brain server-side on a timer. Free upkeep
  # runs always; LLM work stays gated by Research Mode + the USD budget + Fuel.
  AUTONOMY = 'on'

[[mounts]]
  source = 'brain_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Never sleep the machine — the 24/7 autonomy + heartbeat loops must keep running
  # even with no open browser. (This is the always-on cost trade-off, accepted.)
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  # Raised 1gb -> 2gb: the SQLite + sqlite-vec vector index + the baked MiniLM model
  # can spike past 1GB on a busy brain, and an OOM-killed server is exactly what
  # leaves the client hanging on the loading sun. Headroom keeps /api/graph responsive.
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
